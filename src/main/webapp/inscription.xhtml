<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:t="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/templates/layout.xhtml">

  <ui:param name="titre" value="Créer un compte"/>
  <ui:param name="nav" value="inscription"/>

  <ui:define name="metadata">
    <f:metadata>
      <f:viewAction action="#{inscriptionBean.init}"/>
    </f:metadata>
  </ui:define>

  <ui:define name="contenu">
    <section class="auth">
      <div class="auth-carte auth-large">
        <h1>Créer un compte</h1>
        <p class="muted">Quelques informations suffisent. Ton panier est créé avec ton compte.</p>

        <ui:fragment rendered="#{inscriptionBean.avecErreurs}">
          <p class="alerte alerte-erreur" role="alert">Le formulaire contient des erreurs : corrige les champs signalés.</p>
        </ui:fragment>

        <h:form>
          <t:csrf/>
          <div class="deux-col">
            <t:champ nom="prenom" libelle="Prénom" valeur="#{inscriptionBean.form.prenom}"
                     erreurs="#{inscriptionBean.erreurs}" requis="true" autocomplete="given-name" maxlength="80"/>
            <t:champ nom="nom" libelle="Nom" valeur="#{inscriptionBean.form.nom}"
                     erreurs="#{inscriptionBean.erreurs}" requis="true" autocomplete="family-name" maxlength="80"/>
          </div>
          <t:champ nom="email" libelle="Adresse e-mail" type="email" valeur="#{inscriptionBean.form.email}"
                   erreurs="#{inscriptionBean.erreurs}" requis="true" autocomplete="email" maxlength="150"/>
          <div class="deux-col">
            <t:champ nom="motDePasse" libelle="Mot de passe" type="password"
                     valeur="#{inscriptionBean.form.motDePasse}" erreurs="#{inscriptionBean.erreurs}"
                     requis="true" autocomplete="new-password" maxlength="100"
                     aide="8 caractères minimum, avec au moins une lettre et un chiffre."/>
            <t:champ nom="confirmation" libelle="Confirmation" type="password"
                     valeur="#{inscriptionBean.form.confirmation}" erreurs="#{inscriptionBean.erreurs}"
                     requis="true" autocomplete="new-password" maxlength="100"/>
          </div>
          <t:champ nom="adresse" libelle="Adresse de livraison" valeur="#{inscriptionBean.form.adresse}"
                   erreurs="#{inscriptionBean.erreurs}" autocomplete="street-address" maxlength="255"
                   aide="Facultatif."/>
          <t:champ nom="telephone" libelle="Téléphone" type="tel" valeur="#{inscriptionBean.form.telephone}"
                   erreurs="#{inscriptionBean.erreurs}" autocomplete="tel" maxlength="30"
                   aide="Facultatif, par exemple +212 6 12 34 56 78."/>
          <h:commandButton value="Créer mon compte" action="#{inscriptionBean.inscrire}"
                           styleClass="btn btn-primary btn-block btn-lg"/>
        </h:form>

        <p class="auth-pied">Déjà inscrit ?
          <a href="#{request.contextPath}/connexion.xhtml">Se connecter</a></p>
      </div>
    </section>
  </ui:define>
</ui:composition>
