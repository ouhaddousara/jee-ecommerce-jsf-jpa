<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
  Form field: label, input (text, password or textarea) and the validation message
  coming from the service (a Map field name -> message). The input is bound with
  a two-way expression passed in the "valeur" attribute. No JSF "required" attribute: the business
  rules of the service are the single source of validation, as in workshop 2.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<cc:interface>
  <cc:attribute name="nom" required="true" shortDescription="Field name, also the key in the errors map"/>
  <cc:attribute name="libelle" required="true"/>
  <cc:attribute name="valeur" required="true"/>
  <cc:attribute name="erreurs"/>
  <cc:attribute name="type" default="text"/>
  <cc:attribute name="requis" default="false"/>
  <cc:attribute name="multiligne" default="false"/>
  <cc:attribute name="aide"/>
  <cc:attribute name="autocomplete"/>
  <cc:attribute name="maxlength"/>
  <cc:attribute name="min"/>
  <cc:attribute name="step"/>
</cc:interface>
<cc:implementation>
  <div class="champ#{not empty cc.attrs.erreurs[cc.attrs.nom] ? ' has-error' : ''}">
    <label for="#{cc.clientId}:#{cc.attrs.multiligne ? 'zone' : (cc.attrs.type == 'password' ? 'secret' : 'texte')}">#{cc.attrs.libelle}<ui:fragment rendered="#{cc.attrs.requis}"> <span class="req" title="obligatoire">*</span></ui:fragment></label>

    <h:inputTextarea id="zone" rendered="#{cc.attrs.multiligne}" value="#{cc.attrs.valeur}" rows="4"
                     pt:maxlength="#{cc.attrs.maxlength}"/>

    <h:inputSecret id="secret" rendered="#{not cc.attrs.multiligne and cc.attrs.type == 'password'}"
                   value="#{cc.attrs.valeur}"
                   pt:maxlength="#{cc.attrs.maxlength}" pt:autocomplete="#{cc.attrs.autocomplete}"/>

    <h:inputText id="texte" rendered="#{not cc.attrs.multiligne and cc.attrs.type != 'password'}"
                 value="#{cc.attrs.valeur}"
                 pt:type="#{cc.attrs.type}" pt:maxlength="#{cc.attrs.maxlength}"
                 pt:autocomplete="#{cc.attrs.autocomplete}" pt:min="#{cc.attrs.min}" pt:step="#{cc.attrs.step}"/>

    <ui:fragment rendered="#{not empty cc.attrs.aide and empty cc.attrs.erreurs[cc.attrs.nom]}">
      <p class="aide">#{cc.attrs.aide}</p>
    </ui:fragment>
    <ui:fragment rendered="#{not empty cc.attrs.erreurs[cc.attrs.nom]}">
      <p class="erreur">#{cc.attrs.erreurs[cc.attrs.nom]}</p>
    </ui:fragment>
  </div>
</cc:implementation>
</html>
