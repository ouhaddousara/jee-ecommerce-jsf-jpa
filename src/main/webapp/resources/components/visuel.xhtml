<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!-- Product picture: the image if there is one, otherwise a gradient tied to the category. -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<cc:interface>
  <cc:attribute name="produit" required="true"/>
  <cc:attribute name="taille"/>
</cc:interface>
<cc:implementation>
  <div class="visuel ton-#{cc.attrs.produit.categorie.id % 6} #{cc.attrs.taille}">
    <ui:fragment rendered="#{not empty cc.attrs.produit.imageUrl}">
      <img src="#{cc.attrs.produit.imageUrl}" alt="" loading="lazy"/>
    </ui:fragment>
    <ui:fragment rendered="#{empty cc.attrs.produit.imageUrl}">
      <span class="visuel-initiales" aria-hidden="true">#{affichage.initiales(cc.attrs.produit.nom)}</span>
      <span class="visuel-ref">#{cc.attrs.produit.reference}</span>
    </ui:fragment>
  </div>
</cc:implementation>
</html>
