<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:t="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/templates/layout.xhtml">

  <ui:param name="titre" value="#{categorieAdminBean.titre}"/>
  <ui:param name="nav" value="categories"/>

  <ui:define name="metadata">
    <f:metadata>
      <f:viewParam name="id" value="#{categorieAdminBean.id}"/>
      <f:viewAction action="#{categorieAdminBean.charger}"/>
    </f:metadata>
  </ui:define>

  <ui:define name="contenu">

    <div class="entete">
      <div>
        <p class="eyebrow">Administration</p>
        <h1 class="titre-page">#{categorieAdminBean.titre}</h1>
      </div>
    </div>

    <section class="formulaire formulaire-etroit">
      <ui:fragment rendered="#{categorieAdminBean.avecErreurs}">
        <p class="alerte alerte-erreur" role="alert">Le formulaire contient des erreurs : corrige les champs signalés.</p>
      </ui:fragment>

      <h:form>
        <t:csrf/>
        <t:champ nom="nom" libelle="Nom" valeur="#{categorieAdminBean.form.nom}"
                 erreurs="#{categorieAdminBean.erreurs}" requis="true" maxlength="100"/>
        <t:champ nom="description" libelle="Description" valeur="#{categorieAdminBean.form.description}"
                 erreurs="#{categorieAdminBean.erreurs}" multiligne="true" maxlength="255" aide="Facultatif."/>
        <div class="formulaire-actions">
          <h:commandButton value="Enregistrer" action="#{categorieAdminBean.enregistrer}"
                           styleClass="btn btn-primary btn-lg"/>
          <a class="btn btn-ghost btn-lg" href="#{request.contextPath}/admin/categories.xhtml">Annuler</a>
        </div>
      </h:form>
    </section>

  </ui:define>
</ui:composition>
