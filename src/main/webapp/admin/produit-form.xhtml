<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:t="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/templates/layout.xhtml">

  <ui:param name="titre" value="#{produitAdminBean.titre}"/>
  <ui:param name="nav" value="produits"/>

  <ui:define name="metadata">
    <f:metadata>
      <f:viewParam name="id" value="#{produitAdminBean.id}"/>
      <f:viewAction action="#{produitAdminBean.charger}"/>
    </f:metadata>
  </ui:define>

  <ui:define name="contenu">

    <div class="entete">
      <div>
        <p class="eyebrow">Administration</p>
        <h1 class="titre-page">#{produitAdminBean.titre}</h1>
      </div>
    </div>

    <section class="formulaire">
      <ui:fragment rendered="#{produitAdminBean.avecErreurs}">
        <p class="alerte alerte-erreur" role="alert">Le formulaire contient des erreurs : corrige les champs signalés.</p>
      </ui:fragment>

      <!-- The bean (view scope) keeps the product id and its version read when the page opened:
           the service refuses a save based on an outdated copy. -->
      <h:form>
        <t:csrf/>

        <div class="deux-col">
          <t:champ nom="reference" libelle="Référence" valeur="#{produitAdminBean.form.reference}"
                   erreurs="#{produitAdminBean.erreurs}" requis="true" maxlength="40"
                   aide="Lettres, chiffres, point et tiret. Exemple : INF-004."/>
          <t:champ nom="nom" libelle="Nom du produit" valeur="#{produitAdminBean.form.nom}"
                   erreurs="#{produitAdminBean.erreurs}" requis="true" maxlength="150"/>
        </div>

        <t:champ nom="description" libelle="Description" valeur="#{produitAdminBean.form.description}"
                 erreurs="#{produitAdminBean.erreurs}" multiligne="true" maxlength="2000" aide="Facultatif."/>

        <div class="trois-col">
          <t:champ nom="prix" libelle="Prix (MAD)" valeur="#{produitAdminBean.form.prix}"
                   erreurs="#{produitAdminBean.erreurs}" requis="true" aide="Exemple : 129,90"/>
          <t:champ nom="stock" libelle="Stock" type="number" valeur="#{produitAdminBean.form.stock}"
                   erreurs="#{produitAdminBean.erreurs}" requis="true" min="0" step="1"/>
          <div class="champ#{not empty produitAdminBean.erreurs['categorieId'] ? ' has-error' : ''}">
            <h:outputLabel for="categorie">Catégorie <span class="req" title="obligatoire">*</span></h:outputLabel>
            <h:selectOneMenu id="categorie" value="#{produitAdminBean.form.categorieId}">
              <f:selectItem itemValue="" itemLabel="Choisir…" noSelectionOption="true"/>
              <!-- The id is given as text: the form keeps categorieId as a String. -->
              <f:selectItems value="#{produitAdminBean.categories}" var="c"
                             itemValue="#{c.id.toString()}" itemLabel="#{c.nom}"/>
            </h:selectOneMenu>
            <ui:fragment rendered="#{not empty produitAdminBean.erreurs['categorieId']}">
              <p class="erreur">#{produitAdminBean.erreurs['categorieId']}</p>
            </ui:fragment>
          </div>
        </div>

        <t:champ nom="imageUrl" libelle="Adresse de l'image" type="url" valeur="#{produitAdminBean.form.imageUrl}"
                 erreurs="#{produitAdminBean.erreurs}" maxlength="255"
                 aide="Facultatif, en https. Sans image, un visuel coloré est affiché."/>

        <label class="case">
          <h:selectBooleanCheckbox value="#{produitAdminBean.form.actif}"/>
          <span>En vente (visible dans la vitrine)</span>
        </label>

        <div class="formulaire-actions">
          <h:commandButton value="Enregistrer" action="#{produitAdminBean.enregistrer}"
                           styleClass="btn btn-primary btn-lg"/>
          <a class="btn btn-ghost btn-lg" href="#{request.contextPath}/admin/produits.xhtml">Annuler</a>
        </div>
      </h:form>
    </section>

  </ui:define>
</ui:composition>
